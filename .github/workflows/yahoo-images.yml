name: Product images (Yahoo!ショッピング)

# 商品画像を Yahoo!ショッピング 商品検索API で探して data/images.json を更新する。
# 月1回と手動。PR では保存せず、一致の結果だけをログに出す（照合の確認用）。
on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:
    inputs:
      only:
        description: "この ID を含む製品だけ（正規表現・空なら全件）"
        required: false
      missing:
        description: "画像がまだない製品だけ（取りこぼしの取り直し）"
        type: boolean
        default: false
  pull_request:
    paths:
      - tools/fetch_yahoo_images.py
      - .github/workflows/yahoo-images.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: yahoo-images
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Dry run (PR)
        if: github.event_name == 'pull_request'
        env:
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
        run: python3 tools/fetch_yahoo_images.py --dry-run --limit 25
      - name: Fetch images
        if: github.event_name != 'pull_request'
        env:
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
          ONLY: ${{ inputs.only }}
          MISSING: ${{ inputs.missing && '--missing' || '' }}
        run: python3 tools/fetch_yahoo_images.py ${ONLY:+--only "$ONLY"} $MISSING
      - name: Commit and publish
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/build_api.py data/products.json _site > /dev/null
          if git diff --quiet -- data/images.json && git ls-files --error-unmatch data/images.json >/dev/null 2>&1; then
            echo "変更なし"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/images.json
          git commit -m "商品画像を更新（Yahoo!ショッピング）"
          # 取得には10分ほどかかるので、その間に main が進んでいることがある。images.json はこのワークフローしか書かないので、最新に載せ直してから push する
          pushed=
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then pushed=1; break; fi
            sleep 5
          done
          [ -n "$pushed" ] || { echo "push に失敗しました"; exit 1; }
          # GITHUB_TOKEN の push では他のワークフローが動かないので、公開を手動で起動する
          gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
